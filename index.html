<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Пыльца — Стример (Firebase)</title>
<style>
  body { background:#0a0a0f; color:#e0e0e0; font-family:monospace; padding:20px; max-width:480px; margin:0 auto; }
  video { width:100%; aspect-ratio:4/3; background:#000; border-radius:12px; }
  button { width:100%; padding:14px; margin-top:12px; background:#ff4081; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; }
  #status { margin-top:10px; font-size:13px; color:#888; }
  #log { margin-top:10px; font-size:11px; color:#0f0; max-height:250px; overflow-y:auto; background:#000; padding:8px; border-radius:8px; white-space:pre-wrap; }
  .version { font-size:10px; color:#555; margin-bottom:8px; }
</style>
</head>
<body>
  <h2>🎬 Стример <span class="version">v2.1 — 160x120, avc1.42001E</span></h2>
  <video id="cam" autoplay muted playsinline></video>
  <button id="startBtn">▶ НАЧАТЬ СТРИМ</button>
  <div id="status">Ожидание...</div>
  <div id="log"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyD7XJDjs..................",
  authDomain: "creator-75dac.firebaseapp.com",
  databaseURL: "https://creator-75dac-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "creator-75dac",
  storageBucket: "creator-75dac.firebasestorage.app",
  messagingSenderId: "86422721022",
  appId: "1:86422721022:web:ed2ae88a1bc1be46eff0af"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const LOG = document.getElementById('log');

function log(msg, color='#0f0') {
  LOG.innerHTML += `<span style="color:${color}">[${(performance.now()/1000).toFixed(2)}s] ${msg}</span>\n`;
  LOG.scrollTop = LOG.scrollHeight;
}

let streaming = false;
let nalCounter = 0;

log('🟢 Стример v2.1 запущен');
log('   160x120, avc1.42001E, 10fps, 100kbps');

async function startStream() {
  log('🎥 Запрашиваю камеру (160x120)...');
  
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ 
      video: { width:160, height:120, frameRate:10 }, 
      audio: false 
    });
    log('✅ Камера получена (160x120, 10fps)', '#0f0');
  } catch(e) {
    log('❌ Ошибка камеры: ' + e.message, '#f55');
    statusEl.textContent = '❌ Нет доступа к камере';
    return;
  }
  
  document.getElementById('cam').srcObject = stream;
  statusEl.textContent = '📷 Камера захвачена. Кодирую...';
  
  const videoTrack = stream.getVideoTracks()[0];
  const processor = new MediaStreamTrackProcessor({ track: videoTrack });
  const reader = processor.readable.getReader();
  log('✅ MediaStreamTrackProcessor создан');

  const encoder = new VideoEncoder({
    output: async (chunk) => {
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      
      await set(ref(db, `dust/${nalCounter}`), {
        d: btoa(String.fromCharCode(...Array.from(data))),
        t: Date.now()
      });
      
      nalCounter++;
      if (nalCounter % 5 === 0) {
        log(`   📡 Отправлено ${nalCounter} кадров, последний: ${data.length} байт`, '#ff0');
      }
      
      await new Promise(resolve => setTimeout(resolve, 1000));
    },
    error: (e) => {
      log('❌ Ошибка кодера: ' + e.message, '#f55');
    }
  });

  encoder.configure({
    codec: 'avc1.42001E',
    width: 160,
    height: 120,
    bitrate: 100_000,
    framerate: 10
  });
  log('✅ Кодер сконфигурирован', '#0f0');

  streaming = true;
  statusEl.textContent = '🔴 LIVE — 1 кадр/сек';
  startBtn.style.display = 'none';

  while (streaming) {
    try {
      const { done, value } = await reader.read();
      if (done) break;
      encoder.encode(value);
      value.close();
    } catch(e) {
      log('❌ Ошибка чтения: ' + e.message, '#f55');
      break;
    }
  }
  
  log('⏹ Стрим остановлен', '#f55');
}

startBtn.addEventListener('click', startStream);
</script>
</body>
</html>
