<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Пыльца — Стример (Firebase)</title>
<style>
  body { background:#0a0a0f; color:#e0e0e0; font-family:monospace; padding:20px; max-width:480px; margin:0 auto; }
  video { width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; }
  button { width:100%; padding:14px; margin-top:12px; background:#ff4081; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; }
  #status { margin-top:10px; font-size:13px; color:#888; }
  #log { margin-top:10px; font-size:11px; color:#0f0; max-height:250px; overflow-y:auto; background:#000; padding:8px; border-radius:8px; white-space:pre-wrap; }
</style>
</head>
<body>
  <h2>🎬 Стример</h2>
  <video id="cam" autoplay muted playsinline></video>
  <button id="startBtn">▶ НАЧАТЬ СТРИМ</button>
  <div id="status">Ожидание...</div>
  <div id="log"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyD7XJDjs..................",
  authDomain: "creator-75dac.firebaseapp.com",
  databaseURL: "https://creator-75dac-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "creator-75dac",
  storageBucket: "creator-75dac.firebasestorage.app",
  messagingSenderId: "86422721022",
  appId: "1:86422721022:web:ed2ae88a1bc1be46eff0af"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const LOG = document.getElementById('log');

function log(msg, color='#0f0') {
  LOG.innerHTML += `<span style="color:${color}">[${(performance.now()/1000).toFixed(2)}s] ${msg}</span>\n`;
  LOG.scrollTop = LOG.scrollHeight;
}

let streaming = false;
let nalCounter = 0;
let chunkBuffer = [];
const CHUNK_SIZE = 16384;

log('🟢 Стример запущен');
log('📡 Firebase: ' + firebaseConfig.databaseURL);

async function startStream() {
  log('🎥 Запрашиваю камеру...');
  
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ 
      video: { width:640, height:360, frameRate:30 }, 
      audio: false 
    });
    log('✅ Камера получена', '#0f0');
  } catch(e) {
    log('❌ Ошибка камеры: ' + e.message, '#f55');
    statusEl.textContent = '❌ Нет доступа к камере';
    return;
  }
  
  document.getElementById('cam').srcObject = stream;
  statusEl.textContent = '📷 Камера захвачена. Кодирую...';
  
  const videoTrack = stream.getVideoTracks()[0];
  log(`   Трек: ${videoTrack.label}, ${videoTrack.getSettings().width}x${videoTrack.getSettings().height}`);
  
  const processor = new MediaStreamTrackProcessor({ track: videoTrack });
  const reader = processor.readable.getReader();
  log('✅ MediaStreamTrackProcessor создан');

  const encoder = new VideoEncoder({
    output: async (chunk) => {
      log(`   📤 Выход кодера: ${chunk.byteLength} байт, тип=${chunk.type}, timestamp=${chunk.timestamp}`);
      
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      
      // Разбиваем на мини-порции
      let pieces = 0;
      for (let i = 0; i < data.length; i += CHUNK_SIZE) {
        const piece = data.slice(i, i + CHUNK_SIZE);
        chunkBuffer.push(Array.from(piece));
        pieces++;
      }
      log(`      Разбито на ${pieces} порций, буфер: ${chunkBuffer.length}`);
      
      // Отправляем буфер в Firebase
      let sent = 0;
      while (chunkBuffer.length > 0) {
        const batch = chunkBuffer.splice(0, 5);
        const promises = batch.map((piece, idx) => {
          const path = `dust/${nalCounter}`;
          nalCounter++;
          return set(ref(db, path), {
            d: btoa(String.fromCharCode(...piece)),
            t: Date.now()
          });
        });
        await Promise.all(promises);
        sent += batch.length;
      }
      if (sent > 0) log(`   📡 Отправлено ${sent} пылинок в Firebase, всего: ${nalCounter}`, '#ff0');
    },
    error: (e) => {
      log('❌ Ошибка кодера: ' + e.message, '#f55');
      statusEl.textContent = '❌ Ошибка кодера: ' + e.message;
    }
  });

  log('🔧 Конфигурирую кодер (avc1.42E01F, 640x360, 1Mbps)...');
  encoder.configure({
    codec: 'avc1.42E01F',
    width: 640,
    height: 360,
    bitrate: 1_000_000,
    framerate: 30
  });
  log(`✅ Кодер сконфигурирован, state=${encoder.state}`, '#0f0');

  streaming = true;
  statusEl.textContent = '🔴 LIVE — Отправляю пыльцу...';
  startBtn.style.display = 'none';
  log('🔴 Стрим начат. Читаю кадры с камеры...');

  let frameCount = 0;
  // Читаем кадры с камеры
  while (streaming) {
    try {
      const { done, value } = await reader.read();
      if (done) {
        log('⚠️ Reader завершён (done=true)', '#f55');
        break;
      }
      frameCount++;
      if (frameCount % 30 === 0) {
        log(`   📹 Кадр #${frameCount} отправлен в кодер`);
      }
      encoder.encode(value);
      value.close();
    } catch(e) {
      log('❌ Ошибка чтения кадра: ' + e.message, '#f55');
      break;
    }
  }
  
  log('⏹ Стрим остановлен', '#f55');
  statusEl.textContent = 'Стрим остановлен';
}

startBtn.addEventListener('click', startStream);
</script>
</body>
</html>
