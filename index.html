<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пыльца — Стример (5-bit Key) v8</title>
<style>
body{background:#0a0a0f;color:#e0e0e0;font-family:monospace;padding:10px;max-width:400px;margin:0 auto}
video{display:none}
canvas{width:100%;border-radius:8px;background:#000}
button{width:100%;padding:14px;margin-top:10px;background:#ff4081;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
#stop-btn{background:#555}
#export-btn{background:#4CAF50}
#status{margin-top:8px;font-size:12px;color:#888}
#stats-panel{background:#111;border:1px solid #333;border-radius:8px;padding:8px;margin-top:10px;font-family:monospace;font-size:11px}
.stat-row{display:flex;justify-content:space-between;margin:3px 0}
.stat-label{color:#888}
.stat-value{color:#ff4081;font-weight:700}
#debug-panel{background:#111;border:1px solid #ff4081;border-radius:8px;padding:8px;margin-top:10px;font-family:monospace;font-size:10px}
#debug-content{margin-top:5px;color:#0f0;max-height:150px;overflow-y:auto;white-space:pre-wrap}
.button-row{display:flex;gap:10px}
.button-row button{flex:1}
#export-panel{display:none;background:#111;border:1px solid #4CAF50;border-radius:8px;padding:8px;margin-top:10px}
#export-panel textarea{width:100%;height:100px;background:#0a0a0f;color:#0f0;border:1px solid #333;border-radius:4px;font-family:monospace;font-size:10px;resize:vertical;margin-bottom:8px}
#export-panel .export-label{color:#4CAF50;font-size:11px;margin-bottom:5px;font-weight:700}
</style>
</head>
<body>
<h3>🎬 Стример 5-bit Key v8</h3>
<video id="cam" autoplay muted playsinline></video>
<canvas id="c"></canvas>
<div class="button-row">
<button id="btn">▶ СТАРТ</button>
<button id="stop-btn" style="display:none">⏹ СТОП</button>
</div>
<div id="status">Ожидание...</div>
<div id="stats-panel">
<div style="color:#ff4081;font-weight:700;margin-bottom:5px">📊 Текущий пакет</div>
<div class="stat-row"><span class="stat-label">Кадры:</span><span class="stat-value" id="stat-frames">0/10</span></div>
<div class="stat-row"><span class="stat-label">Размер пакета:</span><span class="stat-value" id="stat-pack-size">0 B</span></div>
<div class="stat-row"><span class="stat-label">Размер до base64:</span><span class="stat-value" id="stat-raw">0 B</span></div>
<div class="stat-row"><span class="stat-label">Всего в localStorage:</span><span class="stat-value" id="stat-total">0 пакетов</span></div>
</div>
<div id="debug-panel">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="color:#ff4081;font-weight:700">🛠 DEBUG</span>
<button onclick="copyDebug()" style="background:#333;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:9px">📋</button>
</div>
<div id="debug-content"></div>
</div>
<div id="export-panel">
<div class="export-label">📤 Скопируй этот JSON и вставь в плеер</div>
<textarea id="export-data" readonly></textarea>
<button id="export-btn" onclick="copyExport()">📋 Копировать всё</button>
</div>

<script>
const video=document.getElementById('cam');
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const btn=document.getElementById('btn');
const stopBtn=document.getElementById('stop-btn');
const statusEl=document.getElementById('status');
const debugContent=document.getElementById('debug-content');
const exportPanel=document.getElementById('export-panel');
const exportData=document.getElementById('export-data');

const STORAGE_KEY='pollen_frames';
const TARGET_WIDTH=120;
const FRAMES_PER_PACKET=10;
const CAPTURE_INTERVAL=100;
const ROW_HEIGHT=2;
const KEY_MERGE_DIST=2;

let streaming=false;
let animationId=null;
let previousFrame=null;
let allPackets=[];

try{
const stored=localStorage.getItem(STORAGE_KEY);
if(stored){allPackets=JSON.parse(stored);if(!Array.isArray(allPackets))allPackets=[]}
}catch(e){allPackets=[]}

function debug(msg,color){
let time=new Date().toLocaleTimeString();
debugContent.innerHTML+=`<span style="color:${color||'#0f0'}">[${time}] ${msg}</span>\n`;
debugContent.scrollTop=debugContent.scrollHeight
}
window.copyDebug=function(){
navigator.clipboard.writeText(debugContent.innerText).then(()=>debug('✅ Скопировано','#ff0'))
}

function packTriplet(v0,v1,v2){
const packed=(v0<<10)|(v1<<5)|v2;
return[(packed>>8)&0xFF,packed&0xFF]
}

function extractRowKeys(grayValues,w,rowStart){
const keys=[];
let prevValue=-1;
for(let x=0;x<w;x++){
const idx1=(rowStart*w+x);
const idx2=((rowStart+1)*w+x);
let value;
if(rowStart+1<canvas.height){
value=Math.round((grayValues[idx1]+grayValues[idx2])/2)
}else{value=grayValues[idx1]}
if(value!==prevValue&&value!==0){
keys.push({x:x,value:value})
}
prevValue=value
}
if(keys.length>1){
const merged=[keys[0]];
for(let i=1;i<keys.length;i++){
const last=merged[merged.length-1];
if(keys[i].x-last.x<=KEY_MERGE_DIST){
last.value=Math.round((last.value+keys[i].value)/2)
}else{merged.push(keys[i])}
}
return merged
}
return keys
}

function encodeFullFrame(grayValues,w,h){
const bytes=[];
const numRows=Math.floor(h/ROW_HEIGHT);
for(let row=0;row<numRows;row++){
const keys=extractRowKeys(grayValues,w,row*ROW_HEIGHT);
bytes.push(keys.length);
let valBuffer=[];
for(const key of keys){
bytes.push(key.x&0xFF);
valBuffer.push(key.value&0x1F)
}
for(let i=0;i<valBuffer.length;i+=3){
const v0=valBuffer[i]||0;
const v1=valBuffer[i+1]||0;
const v2=valBuffer[i+2]||0;
const packed=packTriplet(v0,v1,v2);
bytes.push(packed[0],packed[1])
}
}
return new Uint8Array(bytes)
}

function encodeDeltaFrame(currentGray,prevGray,w,h){
const bytes=[];
const numRows=Math.floor(h/ROW_HEIGHT);
let activeRows=0;
const rowData=[];
for(let row=0;row<numRows;row++){
const currKeys=extractRowKeys(currentGray,w,row*ROW_HEIGHT);
const prevKeys=extractRowKeys(prevGray,w,row*ROW_HEIGHT);
const offsets=[];
const minLen=Math.min(currKeys.length,prevKeys.length);
for(let i=0;i<minLen;i++){
const offset=currKeys[i].x-prevKeys[i].x;
if(offset!==0)offsets.push(offset)
}
if(currKeys.length!==prevKeys.length||offsets.length>0){
activeRows++;
rowData.push({row:row,offsets:offsets,keyCount:currKeys.length})
}
}
bytes.push(activeRows);
for(const rd of rowData){
bytes.push(rd.row);
bytes.push(rd.keyCount);
bytes.push(rd.offsets.length);
for(const offset of rd.offsets){
bytes.push(offset&0xFF)
}
}
return new Uint8Array(bytes)
}

async function start(){
debug('🎥 Запрос камеры...','#ff0');
let stream;
try{
stream=await navigator.mediaDevices.getUserMedia({
video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},
audio:false
});
video.srcObject=stream;
await video.play();
const aspectRatio=video.videoWidth/video.videoHeight;
const targetHeight=Math.round(TARGET_WIDTH/aspectRatio);
const finalHeight=targetHeight%2===0?targetHeight:targetHeight+1;
canvas.width=TARGET_WIDTH;
canvas.height=finalHeight;
debug('✅ Камера готова','#0f0');
debug(`   Размер: ${TARGET_WIDTH}x${finalHeight}`,'#888');
debug(`   5-bit, ключи, RLE строки 2px`,'#888')
}catch(e){
debug('❌ Камера: '+e.message,'#f55');
return
}

streaming=true;
btn.style.display='none';
stopBtn.style.display='block';
exportPanel.style.display='none';
statusEl.textContent='🔴 LIVE — 5-bit ключевое';
debug('🔄 Цикл захвата запущен','#ff0');

const frameRecords=[];
let frameCount=0;
const packetStartTime=Date.now();
const frameSizes=[];
const frameTypes=[];
previousFrame=null;

function captureFrame(){
if(!streaming)return;
try{
ctx.drawImage(video,0,0,canvas.width,canvas.height);
const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
const pixels=imageData.data;
const currentGray=[];
for(let i=0;i<pixels.length;i+=4){
const gray=0.299*pixels[i]+0.587*pixels[i+1]+0.114*pixels[i+2];
currentGray.push(Math.round(gray/255*31))
}
let frameRecord;
const frameIndex=frameCount%FRAMES_PER_PACKET;
const isEven=frameIndex%2===0;
if(isEven||!previousFrame){
frameRecord=encodeFullFrame(currentGray,canvas.width,canvas.height);
frameTypes.push('■');
debug(`   Кадр ${frameIndex}: ПОЛНЫЙ — ${frameRecord.length} байт`,'#fa0')
}else{
frameRecord=encodeDeltaFrame(currentGray,previousFrame,canvas.width,canvas.height);
frameTypes.push('Δ');
debug(`   Кадр ${frameIndex}: ДЕЛЬТА — ${frameRecord.length} байт`,'#88f')
}
previousFrame=[...currentGray];
frameRecords.push(frameRecord);
frameSizes.push(frameRecord.length);
frameCount++;
document.getElementById('stat-frames').textContent=`${frameRecords.length}/10`;
if(frameRecords.length>=FRAMES_PER_PACKET){
savePacket(frameRecords,packetStartTime,frameSizes,frameTypes);
frameRecords.length=0;
frameSizes.length=0;
frameTypes.length=0
}
}catch(e){
debug('💥 ОШИБКА: '+e.message,'#f55')
}
if(streaming)animationId=setTimeout(captureFrame,CAPTURE_INTERVAL)
}

function savePacket(recordsList,startTime,sizes,types){
try{
let totalLength=0;
for(const record of recordsList)totalLength+=record.length;
const combinedData=new Uint8Array(totalLength);
let offset=0;
for(const record of recordsList){
combinedData.set(record,offset);
offset+=record.length
}
const sizeBefore=combinedData.length;
let binary='';
for(let i=0;i<combinedData.length;i++)binary+=String.fromCharCode(combinedData[i]);
const b64=btoa(binary);
const sizeAfter=b64.length;
const packet={
n:FRAMES_PER_PACKET,
w:canvas.width,
h:canvas.height,
b:5,
t:startTime,
d:b64
};
allPackets.push(packet);
localStorage.setItem(STORAGE_KEY,JSON.stringify(allPackets));
document.getElementById('stat-pack-size').textContent=`${sizeAfter} B`;
document.getElementById('stat-raw').textContent=`${sizeBefore} B`;
document.getElementById('stat-total').textContent=`${allPackets.length} пакетов`;
debug(`📦 ПАКЕТ #${allPackets.length}:`,'#ff0');
for(let i=0;i<recordsList.length;i++){
debug(`     ${i}: ${types[i]} ${sizes[i]} байт`,'#666')
}
debug(`   Суммарно: ${sizeBefore} B → base64: ${sizeAfter} B`,'#ff0');
debug(`   Всего в localStorage: ${allPackets.length} пакетов`,'#ff0');
statusEl.textContent=`🔴 LIVE — пакет #${allPackets.length}`
}catch(e){
debug('💥 ОШИБКА сохранения: '+e.message,'#f55')
}
}

captureFrame()
}

function stop(){
streaming=false;
if(animationId){clearTimeout(animationId);animationId=null}
if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}
btn.style.display='block';
stopBtn.style.display='none';
statusEl.textContent='⏹ Остановлен';
const totalPackets=allPackets.length;
debug(`✅ Стрим остановлен. Пакетов: ${totalPackets}`,'#0f0');
if(totalPackets>0){
const json=JSON.stringify(allPackets,null,2);
exportData.value=json;
exportPanel.style.display='block';
debug(`📤 Данные готовы к экспорту (${(json.length/1024).toFixed(1)} KB)`,'#0f0')
}
}

window.copyExport=function(){
navigator.clipboard.writeText(exportData.value).then(()=>{
debug('✅ Экспорт скопирован в буфер обмена','#ff0')
})
}

btn.addEventListener('click',start);
stopBtn.addEventListener('click',stop);
document.getElementById('stat-total').textContent=`${allPackets.length} пакетов`;
debug('🟢 Стример 5-bit Key v8 загружен','#0f0');
debug(`   localStorage: ${allPackets.length} пакетов`,'#0f0')
</script>
</body>
</html>
