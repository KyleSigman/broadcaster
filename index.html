    function debug(msg, color) {
      let content = document.getElementById('debug-content');
      let time = new Date().toLocaleTimeString();
      content.innerHTML += `<span style="color:${color||'#0f0'}">[${time}] ${msg}</span>\n`;
      content.scrollTop = content.scrollHeight;
    }
    
    function copyDebug() {
      let text = document.getElementById('debug-content').innerText;
      navigator.clipboard.writeText(text).then(() => debug('✅ Скопировано', '#ff0'));
    }
    
    let streaming = false;

    async function start() {

          audio: false 
        });
        video.srcObject = stream;
        await video.play();
        debug('✅ Камера готова', '#0f0');
      } catch(e) {
        debug('❌ Камера: ' + e.message, '#f55');
        return;
      }
