<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пыльца — Стример (4-bit Delta) v6</title>
<style>
  body { background:#0a0a0f; color:#e0e0e0; font-family:monospace; padding:10px; max-width:400px; margin:0 auto; }
  video { display:none; }
  canvas { width:100%; border-radius:8px; background:#000; }
  button { width:100%; padding:14px; margin-top:10px; background:#ff4081; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; }
  #stop-btn { background:#555; }
  #status { margin-top:8px; font-size:12px; color:#888; }
  #stats-panel { background:#111; border:1px solid #333; border-radius:8px; padding:8px; margin-top:10px; font-family:monospace; font-size:11px; }
  .stat-row { display:flex; justify-content:space-between; margin:3px 0; }
  .stat-label { color:#888; }
  .stat-value { color:#ff4081; font-weight:700; }
  #debug-panel { background:#111; border:1px solid #ff4081; border-radius:8px; padding:8px; margin-top:10px; font-family:monospace; font-size:10px; }
  #debug-content { margin-top:5px; color:#0f0; max-height:150px; overflow-y:auto; white-space:pre-wrap; }
  .button-row { display:flex; gap:10px; }
  .button-row button { flex:1; }
</style>
</head>
<body>
  <h3>🎬 Стример 4-bit Delta v6</h3>
  <video id="cam" autoplay muted playsinline></video>
  <canvas id="c"></canvas>
  <div class="button-row">
    <button id="btn">▶ СТАРТ</button>
    <button id="stop-btn" style="display:none;">⏹ СТОП</button>
  </div>
  <div id="status">Ожидание...</div>
  <div id="stats-panel">
    <div style="color:#ff4081; font-weight:700; margin-bottom:5px;">📊 Статистика пакета</div>
    <div class="stat-row"><span class="stat-label">Полных кадров:</span><span class="stat-value" id="stat-full">0</span></div>
    <div class="stat-row"><span class="stat-label">Дельта-кадров:</span><span class="stat-value" id="stat-delta">0</span></div>
    <div class="stat-row"><span class="stat-label">Размер до base64:</span><span class="stat-value" id="stat-raw">0</span></div>
    <div class="stat-row"><span class="stat-label">Размер после base64:</span><span class="stat-value" id="stat-b64">0</span></div>
    <div class="stat-row"><span class="stat-label">Экономия:</span><span class="stat-value" id="stat-save">0%</span></div>
  </div>
  <div id="debug-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="color:#ff4081; font-weight:700;">🛠 DEBUG</span>
      <button onclick="copyDebug()" style="background:#333; color:#fff; border:none; padding:3px 8px; border-radius:4px; cursor:pointer; font-size:9px;">📋 Копировать</button>
    </div>
    <div id="debug-content"></div>
  </div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD7...............",
  authDomain: "creator-75dac.firebaseapp.com",
  databaseURL: "https://creator-75dac-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "creator-75dac",
  storageBucket: "creator-75dac.firebasestorage.app",
  messagingSenderId: "86422721022",
  appId: "1:86422721022:web:ed2ae88a1bc1be46eff0af",
  measurementId: "G-FN7KWCZX7X"
};

const app = initializeApp(FIREBASE_CONFIG);
const db = getDatabase(app);

const video = document.getElementById('cam');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const btn = document.getElementById('btn');
const stopBtn = document.getElementById('stop-btn');
const statusEl = document.getElementById('status');
const debugContent = document.getElementById('debug-content');

function debug(msg, color) {
  let time = new Date().toLocaleTimeString();
  debugContent.innerHTML += `<span style="color:${color||'#0f0'}">[${time}] ${msg}</span>\n`;
  debugContent.scrollTop = debugContent.scrollHeight;
}

window.copyDebug = function() {
  navigator.clipboard.writeText(debugContent.innerText).then(() => debug('✅ Скопировано', '#ff0'));
}

let streaming = false;
let animationId = null;
const TARGET_WIDTH = 120;
const FRAMES_PER_PACKET = 10;
const CAPTURE_INTERVAL = 100; // ms

// Дельта-кодирование
let previousFrame = null; // Храним предыдущий кадр между пакетами
const DELTA_THRESHOLD = 0.4; // 40% порог для дельты

// Статистика текущего пакета
let packetStats = {
  fullFrames: 0,
  deltaFrames: 0,
  rawSizes: [],
  frameTypes: []
};

async function start() {
  debug('🎥 Запрос камеры...', '#ff0');
  
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ 
      video: { width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:30} },
      audio: false 
    });
    video.srcObject = stream;
    await video.play();
    
    // Вычисляем высоту из пропорции камеры
    const aspectRatio = video.videoWidth / video.videoHeight;
    const targetHeight = Math.round(TARGET_WIDTH / aspectRatio);
    // Округляем до чётного
    const finalHeight = targetHeight % 2 === 0 ? targetHeight : targetHeight + 1;
    
    canvas.width = TARGET_WIDTH;
    canvas.height = finalHeight;
    
    debug('✅ Камера готова', '#0f0');
    debug(`   Размер камеры: ${video.videoWidth}x${video.videoHeight}`, '#888');
    debug(`   Целевой размер: ${TARGET_WIDTH}x${finalHeight}`, '#888');
    debug(`   Битовость: 4-bit яркость`, '#888');
    debug(`   Дельта-порог: ${DELTA_THRESHOLD * 100}%`, '#888');
  } catch(e) {
    debug('❌ Камера: ' + e.message, '#f55');
    return;
  }

  streaming = true;
  btn.style.display = 'none';
  stopBtn.style.display = 'block';
  statusEl.textContent = '🔴 LIVE — дельта-кодирование';
  debug('🔄 Цикл захвата с дельтой запущен', '#ff0');

  // Массив для буферизации записей кадров
  const frameRecords = [];
  let frameCount = 0;
  const packetStartTime = Date.now();
  
  // Сбрасываем статистику пакета
  packetStats = {
    fullFrames: 0,
    deltaFrames: 0,
    rawSizes: [],
    frameTypes: []
  };
  
  // Сбрасываем предыдущий кадр при новом старте
  previousFrame = null;

  // Функция захвата одного кадра
  function captureFrame() {
    if (!streaming) return;
    
    try {
      // Захват кадра
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = imageData.data;
      
      // Конвертация в 4-bit яркость
      const currentGrayValues = [];
      for (let i = 0; i < pixels.length; i += 4) {
        const gray = 0.299 * pixels[i] + 0.587 * pixels[i+1] + 0.114 * pixels[i+2];
        const g4 = Math.round(gray / 255 * 15);
        currentGrayValues.push(g4);
      }
      
      let frameRecord;
      
      // Проверяем, можно ли использовать дельту
      if (previousFrame && previousFrame.length === currentGrayValues.length) {
        // Вычисляем изменения
        const changes = [];
        for (let i = 0; i < currentGrayValues.length; i++) {
          if (currentGrayValues[i] !== previousFrame[i]) {
            changes.push({
              index: i,
              value: currentGrayValues[i]
            });
          }
        }
        
        // Решаем: дельта или полный кадр
        const deltaSize = changes.length * 2.5; // 2 байта на индекс + 0.5 байта на значение
        const fullSize = currentGrayValues.length; // полный кадр
        
        if (deltaSize < fullSize * DELTA_THRESHOLD) {
          // Используем дельту
          frameRecord = createDeltaRecord(changes);
          packetStats.deltaFrames++;
          packetStats.frameTypes.push('Δ');
          debug(`🔹 Кадр ${frameCount + 1}: ДЕЛЬТА — ${changes.length} изм. (${(changes.length/currentGrayValues.length*100).toFixed(1)}%)`, '#88f');
        } else {
          // Используем полный кадр
          frameRecord = createFullRecord(currentGrayValues);
          packetStats.fullFrames++;
          packetStats.frameTypes.push('■');
          debug(`🔸 Кадр ${frameCount + 1}: ПОЛНЫЙ — изм. ${(changes.length/currentGrayValues.length*100).toFixed(1)}% (>${DELTA_THRESHOLD*100}%)`, '#f88');
        }
      } else {
        // Первый кадр или изменение размера — всегда полный
        frameRecord = createFullRecord(currentGrayValues);
        packetStats.fullFrames++;
        packetStats.frameTypes.push('■');
        debug(`■ Кадр ${frameCount + 1}: ПОЛНЫЙ (начальный)`, '#fa0');
      }
      
      // Сохраняем текущий кадр как предыдущий
      previousFrame = [...currentGrayValues];
      
      // Добавляем запись в буфер
      frameRecords.push(frameRecord);
      packetStats.rawSizes.push(frameRecord.length);
      frameCount++;
      
      // Если набралось 10 записей — отправляем пакет
      if (frameRecords.length >= FRAMES_PER_PACKET) {
        sendPacket(frameRecords, packetStartTime);
        frameRecords.length = 0; // Очищаем массив записей
        packetStats.rawSizes = [];
        packetStats.fullFrames = 0;
        packetStats.deltaFrames = 0;
        packetStats.frameTypes = [];
      }
      
    } catch(e) {
      debug('💥 ОШИБКА захвата: ' + e.message, '#f55');
    }
    
    // Продолжаем цикл
    if (streaming) {
      animationId = setTimeout(captureFrame, CAPTURE_INTERVAL);
    }
  }

  // Создание записи полного кадра (тип 0)
  function createFullRecord(grayValues) {
    const record = [];
    record.push(0); // тип 0 = полный кадр
    
    // Упаковываем по 2 пикселя в байт
    for (let i = 0; i < grayValues.length; i += 2) {
      if (i + 1 < grayValues.length) {
        record.push((grayValues[i] << 4) | grayValues[i+1]);
      } else {
        record.push(grayValues[i] << 4);
      }
    }
    
    return new Uint8Array(record);
  }

  // Создание записи дельты (тип 1)
  function createDeltaRecord(changes) {
    const record = [];
    record.push(1); // тип 1 = дельта
    
    // Количество изменений (2 байта, little-endian)
    const count = changes.length;
    record.push(count & 0xFF);        // младший байт
    record.push((count >> 8) & 0xFF); // старший байт
    
    // Пакуем изменения: [индекс: 2 байта][значение: 4 бита]
    let valueBuffer = 0;
    let valueCount = 0;
    
    for (const change of changes) {
      // Индекс (2 байта, little-endian)
      record.push(change.index & 0xFF);
      record.push((change.index >> 8) & 0xFF);
      
      // Значение (4 бита) — пакуем по 2 в байт
      if (valueCount === 0) {
        valueBuffer = change.value << 4;
        valueCount = 1;
      } else {
        valueBuffer |= change.value;
        record.push(valueBuffer);
        valueBuffer = 0;
        valueCount = 0;
      }
    }
    
    // Если осталось недописанное значение
    if (valueCount === 1) {
      record.push(valueBuffer);
    }
    
    return new Uint8Array(record);
  }

  // Функция отправки пакета
  async function sendPacket(recordsList, startTime) {
    const packStart = performance.now();
    
    try {
      // Объединяем все записи в один Uint8Array
      let totalLength = 0;
      for (const record of recordsList) {
        totalLength += record.length;
      }
      
      const combinedData = new Uint8Array(totalLength);
      let offset = 0;
      for (const record of recordsList) {
        combinedData.set(record, offset);
        offset += record.length;
      }
      
      const sizeBefore = combinedData.length;
      
      // Кодируем в base64
      let binary = '';
      for (let i = 0; i < combinedData.length; i++) {
        binary += String.fromCharCode(combinedData[i]);
      }
      const b64 = btoa(binary);
      const sizeAfter = b64.length;
      
      // Создаём пакет для Firebase
      const packet = {
        n: FRAMES_PER_PACKET,
        w: canvas.width,
        h: canvas.height,
        b: 4,
        t: startTime,
        d: b64
      };
      
      // Отправляем в Firebase
      const ts = Date.now();
      await set(ref(db, `dust/${ts}`), packet);
      
      const packTime = (performance.now() - packStart).toFixed(1);
      
      // Вычисляем экономию от дельты
      const fullSizeTheoretical = (canvas.width * canvas.height / 2 + 1) * FRAMES_PER_PACKET; // если бы все полные
      const savings = ((1 - sizeBefore / fullSizeTheoretical) * 100).toFixed(1);
      
      // Обновляем статистику на экране
      updateStatsUI(sizeBefore, sizeAfter, savings);
      
      debug(`📦 ПАКЕТ ОТПРАВЛЕН:`, '#ff0');
      debug(`   Типы кадров: [${packetStats.frameTypes.join(' ')}]`, '#ff0');
      debug(`   Полных: ${packetStats.fullFrames}, Дельта: ${packetStats.deltaFrames}`, '#ff0');
      debug(`   Размер до base64: ${sizeBefore} байт (экономия: ${savings}%)`, '#ff0');
      debug(`   Размер после base64: ${sizeAfter} байт`, '#ff0');
      debug(`   Время упаковки: ${packTime}ms`, '#ff0');
      debug(`   Путь: dust/${ts}`, '#0f0');
      
      // Детальная информация по каждому кадру
      for (let i = 0; i < recordsList.length; i++) {
        const type = packetStats.frameTypes[i] || '?';
        const size = recordsList[i].length;
        debug(`     Кадр ${i+1}: ${type} ${size} байт`, '#666');
      }
      
      statusEl.textContent = `🔴 LIVE — пакет ${new Date(ts).toLocaleTimeString()} (Δ:${packetStats.deltaFrames}/10)`;
      
    } catch(e) {
      debug('💥 ОШИБКА отправки: ' + e.message, '#f55');
    }
  }

  // Обновление UI статистики
  function updateStatsUI(rawSize, b64Size, savings) {
    document.getElementById('stat-full').textContent = packetStats.fullFrames;
    document.getElementById('stat-delta').textContent = packetStats.deltaFrames;
    document.getElementById('stat-raw').textContent = `${rawSize} байт (${(rawSize/1024).toFixed(2)} KB)`;
    document.getElementById('stat-b64').textContent = `${b64Size} байт (${(b64Size/1024).toFixed(2)} KB)`;
    document.getElementById('stat-save').textContent = `${savings}%`;
    
    // Цветовая индикация экономии
    const saveEl = document.getElementById('stat-save');
    if (savings > 30) saveEl.style.color = '#4CAF50';
    else if (savings > 10) saveEl.style.color = '#ff9800';
    else saveEl.style.color = '#f44336';
  }

  // Запускаем захват
  captureFrame();
}

function stop() {
  streaming = false;
  if (animationId) {
    clearTimeout(animationId);
    animationId = null;
  }
  
  // Останавливаем камеру
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
  
  btn.style.display = 'block';
  stopBtn.style.display = 'none';
  statusEl.textContent = '⏹ Остановлен';
  debug('⏹ Стример остановлен пользователем', '#f55');
  debug(`   Последний previousFrame сохранён: ${previousFrame ? 'да' : 'нет'}`, '#888');
}

btn.addEventListener('click', start);
stopBtn.addEventListener('click', stop);
debug('🟢 Стример Delta v6 загружен', '#0f0');
debug('   Дельта-порог: 40% изменений', '#0f0');
debug('   previousFrame сохраняется между пакетами', '#0f0');
</script>
</body>
</html>
